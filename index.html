
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>SenninVideos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root {
  --bg:#ffffff;
  --surface:#ffffff;
  --surface2:#f7f8fa;
  --text:#202124;
  --muted:#858b95;
  --border:#eceef1;
  --blue:#3978ed;
  --blue-light:#edf4ff;
  --sidebar:240px;
  --radius:14px;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,"Noto Sans JP",sans-serif;
}
button,input {font:inherit}
button {cursor:pointer}
a {color:inherit;text-decoration:none}
.app {min-height:100vh}
.topbar {
  height:68px;
  display:flex;
  align-items:center;
  gap:24px;
  padding:0 28px;
  position:fixed;
  inset:0 0 auto 0;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  z-index:20;
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:calc(var(--sidebar) - 20px);
  font-size:21px;
  font-weight:800;
  letter-spacing:-1px;
}
.brand-icon {
  width:37px;height:37px;
  border-radius:12px;
  background:var(--blue);
  color:white;
  display:grid;place-items:center;
  font-size:15px;
}
.icon-button {
  border:0;background:transparent;
  width:40px;height:40px;
  border-radius:50%;
  display:grid;place-items:center;
  color:#454b54;
  font-size:17px;
}
.icon-button:hover {background:var(--surface2)}
.search {
  width:min(550px,50vw);
  height:43px;
  margin:auto;
  display:flex;
  align-items:center;
  border:1px solid #e3e6eb;
  border-radius:24px;
  overflow:hidden;
  background:#fafbfc;
}
.search input {
  flex:1;min-width:0;
  border:0;outline:0;
  background:transparent;
  padding:0 19px;
  font-size:14px;
}
.search button {
  width:54px;height:100%;
  border:0;border-left:1px solid var(--border);
  background:#f4f6f8;color:#525966;
}
.top-actions {display:flex;gap:8px;align-items:center}
.status {
  font-size:11px;
  background:#eef8f1;
  color:#23854b;
  padding:7px 11px;
  border-radius:20px;
  white-space:nowrap;
}
.sidebar {
  width:var(--sidebar);
  position:fixed;
  top:68px;bottom:0;left:0;
  background:white;
  border-right:1px solid var(--border);
  padding:20px 13px;
  overflow:auto;
  z-index:15;
  transition:transform .3s;
}
.nav-label {
  padding:12px 13px 9px;
  font-size:11px;
  font-weight:700;
  color:#a0a5ad;
  letter-spacing:1px;
}
.nav-item {
  width:100%;
  display:flex;align-items:center;gap:16px;
  padding:12px 14px;
  border:0;border-radius:10px;
  background:transparent;
  color:#606773;
  font-size:13px;
  text-align:left;
  margin:2px 0;
  transition:.2s;
}
.nav-item i {width:19px;text-align:center;font-size:16px}
.nav-item:hover {background:#f5f7fa;color:var(--text)}
.nav-item.active {background:var(--blue-light);color:var(--blue);font-weight:700}
.sidebar-info {
  margin:30px 9px 0;
  padding:15px;
  background:#f7f9fc;
  border-radius:12px;
  font-size:11px;
  color:var(--muted);
  line-height:1.8;
}
.main {
  margin-left:var(--sidebar);
  padding:96px 34px 50px;
  min-height:100vh;
}
.content {max-width:1500px;margin:auto}
.page-heading {
  display:flex;justify-content:space-between;
  align-items:center;gap:15px;
  margin-bottom:23px;
}
.page-heading h1 {
  font-size:25px;margin:0;
  font-weight:800;letter-spacing:-.7px;
}
.page-subtitle {font-size:12px;color:var(--muted);margin-top:7px}
.refresh-btn {
  border:1px solid var(--border);
  background:white;border-radius:9px;
  padding:10px 14px;color:#626a75;
  font-size:12px;
}
.refresh-btn:hover {background:#f7f8fa}
.categories {
  display:flex;gap:9px;
  overflow:auto;padding:0 0 20px;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar {display:none}
.category {
  white-space:nowrap;
  border:1px solid var(--border);
  background:white;
  color:#555d68;
  border-radius:8px;
  padding:8px 15px;
  font-size:12px;
  transition:.2s;
}
.category:hover,.category.active {
  background:#20242b;color:white;border-color:#20242b;
}
.video-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:29px 20px;
}
.video-card {min-width:0;cursor:pointer;animation:fadeUp .45s both}
.thumb {
  position:relative;
  width:100%;aspect-ratio:16/9;
  background:#eef0f3;
  border-radius:12px;
  overflow:hidden;
}
.thumb img {
  width:100%;height:100%;
  object-fit:cover;
  transition:transform .35s;
}
.video-card:hover .thumb img {transform:scale(1.04)}
.thumb-placeholder {
  height:100%;display:grid;place-items:center;
  color:#c1c7d0;font-size:34px;
}
.duration {
  position:absolute;bottom:9px;right:9px;
  color:white;background:rgba(0,0,0,.78);
  padding:4px 7px;border-radius:5px;
  font-size:10px;
}
.card-info {display:flex;gap:12px;padding:12px 1px}
.card-icon {
  width:35px;height:35px;flex-shrink:0;
  border-radius:50%;background:#eaf1ff;
  color:var(--blue);display:grid;place-items:center;
}
.card-title {
  font-size:13px;font-weight:700;
  line-height:1.65;margin:0 0 6px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.card-meta {font-size:11px;color:var(--muted);line-height:1.8}
.empty {
  text-align:center;padding:90px 15px;color:var(--muted);
}
.empty i {font-size:42px;margin-bottom:20px;color:#d4d9e0}
.empty h3 {color:#454c56;font-size:16px}
.empty p {font-size:12px;line-height:1.8}
.player-layout {
  display:grid;grid-template-columns:minmax(0,1fr) 320px;
  gap:25px;
}
.player-video {
  width:100%;aspect-ratio:16/9;
  background:#080808;border-radius:13px;
  display:block;
}
.player-title {font-size:20px;font-weight:800;margin:19px 0 12px}
.player-meta {
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
}
.player-meta-text {font-size:12px;color:var(--muted)}
.player-actions {display:flex;gap:8px}
.action-btn {
  padding:9px 13px;border:1px solid var(--border);
  background:white;border-radius:8px;
  color:#505762;font-size:12px;
}
.action-btn:hover {background:#f6f8fa}
.description {
  background:#f7f8fa;border-radius:12px;
  padding:17px;margin-top:20px;
  font-size:12px;line-height:1.9;color:#606773;
}
.side-heading {font-size:15px;font-weight:800;margin:0 0 16px}
.related-card {
  display:flex;gap:11px;margin-bottom:16px;
  cursor:pointer;min-width:0;
}
.related-thumb {
  width:125px;aspect-ratio:16/9;
  flex-shrink:0;background:#f0f2f5;
  border-radius:8px;overflow:hidden;
}
.related-thumb img {width:100%;height:100%;object-fit:cover}
.related-title {font-size:11px;font-weight:700;line-height:1.6}
.related-meta {font-size:10px;color:var(--muted);margin-top:6px}
.player-back {margin-bottom:17px}
.settings-panel {
  background:#f7f9fc;border:1px solid var(--border);
  border-radius:12px;padding:20px;
  max-width:650px;
}
.settings-panel h3 {font-size:14px;margin:0 0 10px}
.settings-panel p {font-size:12px;color:var(--muted);line-height:1.8}
.settings-row {
  display:flex;justify-content:space-between;
  align-items:center;padding:14px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.footer {
  margin-top:60px;padding:22px 0;
  border-top:1px solid var(--border);
  font-size:11px;color:#a0a5ad;
}
.mobile-overlay {
  display:none;position:fixed;inset:68px 0 0;
  background:rgba(0,0,0,.3);z-index:14;
}
.loading {
  text-align:center;padding:100px 15px;color:var(--muted);
  font-size:13px;
}
.loading i {font-size:27px;color:var(--blue);margin-bottom:18px}
.error-text {color:#d34c4c}
.speed-select {
  border:1px solid var(--border);
  border-radius:8px;padding:8px;
  background:white;font-size:12px;color:#555;
}
@keyframes fadeUp {
  from {opacity:0;transform:translateY(12px)}
  to {opacity:1;transform:translateY(0)}
}
@media(max-width:1100px) {
  .video-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .player-layout {grid-template-columns:1fr}
  .related-list {display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(max-width:700px) {
  :root {--sidebar:240px}
  .topbar {height:60px;padding:0 12px;gap:8px}
  .brand {min-width:0;font-size:17px;gap:8px}
  .brand-icon {width:33px;height:33px}
  .topbar .search {width:auto;flex:1;margin-left:auto}
  .search {height:38px}
  .search input {padding:0 10px;font-size:12px}
  .search button {width:40px}
  .top-actions {gap:0}
  .status {display:none}
  .sidebar {top:60px;transform:translateX(-100%)}
  .sidebar.open {transform:translateX(0)}
  .mobile-overlay.show {display:block;top:60px}
  .main {margin-left:0;padding:83px 15px 35px}
  .video-grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 11px}
  .thumb {border-radius:9px}
  .card-info {gap:8px;padding-top:9px}
  .card-icon {width:29px;height:29px;font-size:12px}
  .card-title {font-size:11px}
  .card-meta {font-size:9px}
  .page-heading h1 {font-size:21px}
  .player-title {font-size:17px}
  .player-layout {gap:25px}
  .related-list {grid-template-columns:1fr}
  .related-thumb {width:120px}
  .player-video {border-radius:8px}
}
@media(max-width:380px) {
  .video-grid {grid-template-columns:1fr}
  .brand {font-size:15px}
}
</style>
</head>
<body>
<div class="app">

<header class="topbar">
  <button class="icon-button" id="menuBtn" aria-label="メニュー">
    <i class="fa-solid fa-bars"></i>
  </button>
  <a class="brand" href="#" id="brandHome">
    <span class="brand-icon"><i class="fa-solid fa-play"></i></span>
    <span>SenninVideos</span>
  </a>
  <form class="search" id="searchForm">
    <input id="searchInput" type="search" placeholder="動画を検索..." autocomplete="off">
    <button type="submit" aria-label="検索"><i class="fa-solid fa-magnifying-glass"></i></button>
  </form>
  <div class="top-actions">
    <span class="status" id="connectionStatus">接続中...</span>
    <button class="icon-button" id="refreshBtn" title="再読み込み">
      <i class="fa-solid fa-rotate"></i>
    </button>
  </div>
</header>

<div class="mobile-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="nav-label">MENU</div>
  <button class="nav-item active" data-page="home">
    <i class="fa-solid fa-house"></i> ホーム
  </button>
  <button class="nav-item" data-page="popular">
    <i class="fa-solid fa-fire"></i> 人気の動画
  </button>
  <button class="nav-item" data-page="new">
    <i class="fa-regular fa-clock"></i> 新着動画
  </button>
  <div class="nav-label">LIBRARY</div>
  <button class="nav-item" data-page="history">
    <i class="fa-solid fa-clock-rotate-left"></i> 視聴履歴
  </button>
  <button class="nav-item" data-page="settings">
    <i class="fa-solid fa-gear"></i> 設定
  </button>
  <div class="sidebar-info">
    <b>SenninVideos</b><br>
    Your video library.<br>
    GitHub Repository Streaming.
  </div>
</aside>

<main class="main">
  <div class="content" id="content">
    <div class="loading">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <div>リポジトリから動画を取得しています...</div>
    </div>
  </div>
</main>
</div>

<script>
"use strict";

const CONFIG_FILE = "./repository.json";
const VIDEO_FOLDER = "videos/";
const THUMBNAIL_FOLDER = "thumbnails/";

const state = {
  owner: "",
  repo: "",
  branch: "",
  videos: [],
  currentVideo: null,
  page: "home",
  category: "すべて",
  search: "",
  history: JSON.parse(localStorage.getItem("sv_history") || "[]")
};

const content = document.getElementById("content");
const statusEl = document.getElementById("connectionStatus");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

function humanizeFilename(path) {
  const filename = path.split("/").pop().replace(/\.[^.]+$/, "");
  return filename
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function getRawURL(path) {
  const branch = encodeURIComponent(state.branch);
  const safePath = path.split("/").map(encodeURIComponent).join("/");
  return `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${branch}/${safePath}`;
}

function getThumbnail(videoPath, files) {
  const base = videoPath.split("/").pop().replace(/\.[^.]+$/, "");
  const candidates = [
    `${THUMBNAIL_FOLDER}${base}.jpg`,
    `${THUMBNAIL_FOLDER}${base}.jpeg`,
    `${THUMBNAIL_FOLDER}${base}.png`,
    `${THUMBNAIL_FOLDER}${base}.webp`,
    videoPath.replace(/\.[^.]+$/, ".jpg"),
    videoPath.replace(/\.[^.]+$/, ".png"),
    videoPath.replace(/\.[^.]+$/, ".webp")
  ];

  return candidates.find(path => files.has(path)) || "";
}

async function loadRepository() {
  setLoading("リポジトリから動画を取得しています...");

  try {
    const configResponse = await fetch(CONFIG_FILE + "?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!configResponse.ok) {
      throw new Error("repository.json が見つかりません。GitHub Actionsの設定を確認してください。");
    }

    const config = await configResponse.json();

    if (!config.owner || !config.repo || !config.branch) {
      throw new Error("repository.json の設定が不正です。");
    }

    state.owner = config.owner;
    state.repo = config.repo;
    state.branch = config.branch;

    const apiURL = `https://api.github.com/repos/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/git/trees/${encodeURIComponent(state.branch)}?recursive=1`;

    const response = await fetch(apiURL, {
      headers: { "Accept": "application/vnd.github+json" }
    });

    if (!response.ok) {
      if (response.status === 403) {
        throw new Error("GitHub APIのアクセス制限に達しました。時間をおいて再読み込みしてください。");
      }
      if (response.status === 404) {
        throw new Error("リポジトリまたはブランチが見つかりません。公開リポジトリか確認してください。");
      }
      throw new Error("GitHub APIエラー: HTTP " + response.status);
    }

    const tree = await response.json();

    if (tree.truncated) {
      throw new Error("リポジトリのファイル数が多すぎて一覧を完全取得できません。videosフォルダを整理してください。");
    }

    const allFiles = new Set(
      tree.tree
        .filter(item => item.type === "blob")
        .map(item => item.path)
    );

    const extensions = [".mp4", ".webm", ".ogg", ".ogv", ".m4v"];

    state.videos = tree.tree
      .filter(item =>
        item.type === "blob" &&
        item.path.startsWith(VIDEO_FOLDER) &&
        extensions.some(ext => item.path.toLowerCase().endsWith(ext))
      )
      .map(item => ({
        id: item.sha,
        path: item.path,
        title: humanizeFilename(item.path),
        thumbnail: getThumbnail(item.path, allFiles),
        size: item.size || 0,
        category: item.path.split("/").length > 2
          ? item.path.split("/")[1]
          : "その他",
        sha: item.sha
      }))
      .sort((a,b) => a.title.localeCompare(b.title, "ja"));

    statusEl.textContent = "GitHub 接続済み";
    statusEl.style.background = "#eef8f1";
    statusEl.style.color = "#23854b";

    render();
  } catch (error) {
    console.error(error);
    statusEl.textContent = "接続エラー";
    statusEl.style.background = "#fff0f0";
    statusEl.style.color = "#d34c4c";

    content.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h3>動画を取得できませんでした</h3>
        <p>${escapeHTML(error.message)}</p>
        <button class="refresh-btn" onclick="loadRepository()">再試行</button>
      </div>`;
  }
}

function setLoading(message) {
  content.innerHTML = `
    <div class="loading">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <div>${escapeHTML(message)}</div>
    </div>`;
}

function getVideoViews(video) {
  return Number(video.views || 0).toLocaleString("ja-JP");
}

function formatSize(size) {
  if (!size) return "";
  if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
  return (size / (1024 * 1024)).toFixed(1) + " MB";
}

function getFilteredVideos() {
  let list = [...state.videos];

  if (state.page === "popular") {
    list.reverse();
  }

  if (state.page === "new") {
    list.reverse();
  }

  if (state.page === "history") {
    const ids = state.history.map(item => item.id);
    list.sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    list = list.filter(item => ids.includes(item.id));
  }

  if (state.category !== "すべて" && state.page === "home") {
    list = list.filter(item => item.category === state.category);
  }

  if (state.search.trim()) {
    const query = state.search.toLowerCase();
    list = list.filter(item =>
      item.title.toLowerCase().includes(query) ||
      item.path.toLowerCase().includes(query) ||
      item.category.toLowerCase().includes(query)
    );
  }

  return list;
}

function renderCard(video, index) {
  const thumbnail = video.thumbnail
    ? `<img loading="lazy" src="${escapeHTML(getRawURL(video.thumbnail))}" alt="">`
    : `<div class="thumb-placeholder"><i class="fa-solid fa-film"></i></div>`;

  return `
    <article class="video-card" style="animation-delay:${Math.min(index * 35,350)}ms"
      onclick="playVideo('${escapeHTML(video.id)}')">
      <div class="thumb">
        ${thumbnail}
        <span class="duration">${escapeHTML(formatSize(video.size))}</span>
      </div>
      <div class="card-info">
        <div class="card-icon"><i class="fa-solid fa-play"></i></div>
        <div style="min-width:0">
          <h3 class="card-title">${escapeHTML(video.title)}</h3>
          <div class="card-meta">
            ${escapeHTML(video.category)}<br>
            ${escapeHTML(formatSize(video.size))}
          </div>
        </div>
      </div>
    </article>`;
}

function renderHome() {
  const list = getFilteredVideos();
  const categories = ["すべて", ...new Set(state.videos.map(v => v.category))];

  let title = "おすすめ動画";
  if (state.page === "popular") title = "人気の動画";
  if (state.page === "new") title = "新着動画";
  if (state.page === "history") title = "視聴履歴";

  content.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>${title}</h1>
        <div class="page-subtitle">
          ${escapeHTML(state.repo) || "GitHub"} ・ ${list.length}本の動画
        </div>
      </div>
      <button class="refresh-btn" onclick="loadRepository()">
        <i class="fa-solid fa-rotate"></i> 更新
      </button>
    </div>

    ${state.page === "home" ? `
      <div class="categories">
        ${categories.map(cat => `
          <button class="category ${state.category === cat ? "active" : ""}"
            onclick="selectCategory('${escapeHTML(cat)}')">
            ${escapeHTML(cat)}
          </button>`).join("")}
      </div>` : ""}

    ${list.length ? `
      <div class="video-grid">
        ${list.map(renderCard).join("")}
      </div>
    ` : `
      <div class="empty">
        <i class="fa-solid fa-video"></i>
        <h3>動画がありません</h3>
        <p>リポジトリの videos フォルダに動画ファイルを追加してください。</p>
      </div>
    `}
    <div class="footer">© ${new Date().getFullYear()} SenninVideos</div>
  `;
}

function selectCategory(category) {
  state.category = category;
  render();
}

function playVideo(id) {
  const video = state.videos.find(v => v.id === id);
  if (!video) return;

  state.currentVideo = video;

  state.history = [
    { id:video.id, time:Date.now() },
    ...state.history.filter(item => item.id !== video.id)
  ].slice(0,100);

  localStorage.setItem("sv_history", JSON.stringify(state.history));

  renderPlayer();
  closeSidebar();

  const player = document.getElementById("videoPlayer");
  if (player) {
    player.load();
    player.play().catch(() => {});
  }
}

function renderPlayer() {
  const video = state.currentVideo;
  if (!video) return;

  const related = state.videos
    .filter(v => v.id !== video.id)
    .slice(0,8);

  const thumbnail = video.thumbnail
    ? `<img src="${escapeHTML(getRawURL(video.thumbnail))}" alt="">`
    : `<div class="thumb-placeholder"><i class="fa-solid fa-film"></i></div>`;

  content.innerHTML = `
    <button class="refresh-btn player-back" onclick="goHome()">
      <i class="fa-solid fa-arrow-left"></i> 動画一覧に戻る
    </button>

    <div class="player-layout">
      <section>
        <video
          id="videoPlayer"
          class="player-video"
          controls
          playsinline
          preload="metadata"
          poster="${video.thumbnail ? escapeHTML(getRawURL(video.thumbnail)) : ""}"
        >
          <source src="${escapeHTML(getRawURL(video.path))}">
          お使いのブラウザは動画再生に対応していません。
        </video>

        <h1 class="player-title">${escapeHTML(video.title)}</h1>

        <div class="player-meta">
          <div class="player-meta-text">
            ${escapeHTML(video.category)} ・ ${escapeHTML(formatSize(video.size))}
          </div>
          <div class="player-actions">
            <select class="speed-select" id="speedSelect" aria-label="再生速度">
              <option value="0.5">0.5倍</option>
              <option value="0.75">0.75倍</option>
              <option value="1" selected>標準</option>
              <option value="1.25">1.25倍</option>
              <option value="1.5">1.5倍</option>
              <option value="1.75">1.75倍</option>
              <option value="2">2倍</option>
            </select>
            <button class="action-btn" onclick="copyVideoLink()">
              <i class="fa-solid fa-link"></i> リンク
            </button>
          </div>
        </div>

        <div class="description">
          <b>動画情報</b><br>
          ${escapeHTML(video.path)}<br>
          ファイルサイズ：${escapeHTML(formatSize(video.size))}<br>
          配信元：GitHub Repository
        </div>
      </section>

      <aside>
        <h2 class="side-heading">関連動画</h2>
        <div class="related-list">
          ${related.length ? related.map(item => `
            <div class="related-card" onclick="playVideo('${escapeHTML(item.id)}')">
              <div class="related-thumb">
                ${item.thumbnail
                  ? `<img loading="lazy" src="${escapeHTML(getRawURL(item.thumbnail))}" alt="">`
                  : `<div class="thumb-placeholder"><i class="fa-solid fa-film"></i></div>`}
              </div>
              <div style="min-width:0">
                <div class="related-title">${escapeHTML(item.title)}</div>
                <div class="related-meta">${escapeHTML(formatSize(item.size))}</div>
              </div>
            </div>`).join("") : "<p class='card-meta'>関連動画はありません。</p>"}
        </div>
      </aside>
    </div>
  `;

  document.getElementById("speedSelect").addEventListener("change", e => {
    document.getElementById("videoPlayer").playbackRate = Number(e.target.value);
  });
}

function copyVideoLink() {
  const video = state.currentVideo;
  if (!video) return;
  const url = getRawURL(video.path);
  navigator.clipboard.writeText(url).then(() => {
    alert("動画リンクをコピーしました。");
  }).catch(() => {
    prompt("動画リンク", url);
  });
}

function goHome() {
  state.currentVideo = null;
  state.page = "home";
  updateNavigation();
  render();
}

function renderSettings() {
  content.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>設定</h1>
        <div class="page-subtitle">SenninVideosの設定と接続情報</div>
      </div>
    </div>
    <div class="settings-panel">
      <h3>リポジトリ接続</h3>
      <p>このサイトと同じGitHubリポジトリの動画を自動取得します。</p>
      <div class="settings-row"><span>リポジトリ</span><b>${escapeHTML(state.owner)}/${escapeHTML(state.repo)}</b></div>
      <div class="settings-row"><span>ブランチ</span><b>${escapeHTML(state.branch)}</b></div>
      <div class="settings-row"><span>動画フォルダ</span><b>videos/</b></div>
      <div class="settings-row"><span>取得動画数</span><b>${state.videos.length}</b></div>
      <div class="settings-row"><span>視聴履歴</span><b>${state.history.length}件</b></div>
      <p>動画を追加した場合は、更新ボタンを押してください。</p>
      <button class="refresh-btn" onclick="loadRepository()">リポジトリを再読み込み</button>
    </div>
    <div class="footer">SenninVideos</div>
  `;
}

function render() {
  if (state.currentVideo) {
    renderPlayer();
  } else if (state.page === "settings") {
    renderSettings();
  } else {
    renderHome();
  }
}

function updateNavigation() {
  document.querySelectorAll(".nav-item").forEach(item => {
    item.classList.toggle("active", item.dataset.page === state.page);
  });
}

function navigate(page) {
  state.currentVideo = null;
  state.page = page;
  state.category = "すべて";
  state.search = "";
  document.getElementById("searchInput").value = "";
  updateNavigation();
  render();
  closeSidebar();
}

function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.contains("open")
    ? closeSidebar() : openSidebar();
});
document.getElementById("overlay").addEventListener("click", closeSidebar);

document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => navigate(item.dataset.page));
});

document.getElementById("brandHome").addEventListener("click", e => {
  e.preventDefault();
  navigate("home");
});

document.getElementById("refreshBtn").addEventListener("click", loadRepository);

document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  state.currentVideo = null;
  state.page = "home";
  state.category = "すべて";
  state.search = document.getElementById("searchInput").value.trim();
  updateNavigation();
  render();
});

document.getElementById("searchInput").addEventListener("input", e => {
  state.search = e.target.value.trim();
  state.currentVideo = null;
  state.page = "home";
  state.category = "すべて";
  updateNavigation();
  render();
});

window.addEventListener("popstate", () => {
  if (state.currentVideo) {
    state.currentVideo = null;
    render();
  }
});

loadRepository();
</script>
</body>
</html>
